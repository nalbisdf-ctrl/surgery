            saveCaseText();
            CASE.shown[CASE.i] = true;
            render();
            break;
        case 'selfScore': {
            var s = +el.getAttribute('data-s');
            var hc = CASE.hints[CASE.i] || 0;
            CASE.results[CASE.i] = { score: Math.max(0, s - hc * 0.5), raw: s, hintCost: 0, good: [], missing: [], wrong: [], feedback: 'Self-assessment saved – comparing with the teacher\'s answer is a great way to learn.', followup: '' };
            render();
            break;
        }
        case 'dictate':
            dictate(el);
            break;
        case 'tutorOpen':
            TUTOR.open = !TUTOR.open;
            if (TUTOR.open)
                renderTutor();
            else
                $('#tutor').className = '';
            break;
        case 'tutorClose':
            TUTOR.open = false;
            $('#tutor').className = '';
            break;
        case 'tutorAsk':
            tutorAsk(el.getAttribute('data-q'));
            break;
    }
});
function saveCaseText() { var ta = $('#caseAns'); if (ta && CASE)
    CASE.answers[CASE.i] = ta.value; }
document.addEventListener('change', function (ev) {
    var dc = ev.target && ev.target.getAttribute('data-change'), did = ev.target && ev.target.getAttribute('data-id');
    if (dc === 'pd' && PLAN_DRAFT) {
        PLAN_DRAFT[did] = ev.target.value;
        if (did === 'start' || did === 'exam') {
            if (!PLAN_DRAFT.touched)
                spreadLectures(PLAN_DRAFT);
        }
        render();
        return;
    }
    if (dc === 'ph' && PLAN_DRAFT) {
        PLAN_DRAFT.hours[+did] = Math.max(0, +ev.target.value || 0);
        render();
        return;
    }
    if (dc === 'pl' && PLAN_DRAFT) {
        PLAN_DRAFT.lec[did] = ev.target.value;
        PLAN_DRAFT.touched = 1;
        return;
    }
    if (dc === 'ptask') {
        var p = S.plans[APP.subj];
        var t = p && p.tasks.filter(function (x) { return x.id === did; })[0];
        if (t) {
            if (ev.target.checked)
                t.done = Date.now();
            else
                delete t.done;
            planSave(p);
            render();
        }
        return;
    }
    if (ev.target && ev.target.getAttribute('data-change') === 'examDate') {
        S.meta = S.meta || {};
        S.meta.t = 'meta';
        S.meta.id = 'meta';
        S.meta.examDate = ev.target.value;
        save(S.meta);
        render();
    }
});
document.addEventListener('submit', function (ev) { if (ev.target.id === 'emailF') {
    ev.preventDefault();
    emailSubmit();
    return;
} if (ev.target.id === 'tutF') {
    ev.preventDefault();
    var v = $('#tutIn').value.trim();
    if (v)
        tutorAsk(v);
} });
var dictOn = false;
function dictate(btn) {
    if (!DICT)
        return;
    if (dictOn) {
        DICT.stop().catch(function () { });
        return;
    }
    var p = DICT.start();
    if (p && p.catch)
        p.catch(function (e) { dictOn = false; if (e && e.code === 'not_granted') {
            DICT = null;
            render();
        }
        else
            toast('Dictation is not available right now.'); });
    if (!dictate._wired) {
        dictate._wired = true;
        DICT.onFinal(function (o) { var ta = $('#caseAns'); if (ta) {
            ta.value = (ta.value ? ta.value + ' ' : '') + o.text;
            if (CASE)
                CASE.answers[CASE.i] = ta.value;
        } });
        DICT.onState(function (o) { dictOn = o.state === 'listening'; var b = $('#micBtn'); if (b)
            b.textContent = dictOn ? '■ Stop' : '🎤 Dictate'; });
    }
}
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && USE_T)
    flushUse(); });
window.addEventListener('hashchange', function () { var n = location.hash.slice(1); if (n !== VIEW.name && NAV.some(function (x) { return x[0] === n; }))
    go(n); });
if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', boot);
else
    boot();
</script>
