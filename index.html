.fc-stack{position:relative;width:64px;height:78px;flex:none}.fc-stack i,.fc-stack b{position:absolute;inset:0;border-radius:10px;border:2px solid currentColor;background:var(--card)}.fc-stack i:nth-child(1){transform:translate(8px,-8px) rotate(6deg)}.fc-stack i:nth-child(2){transform:translate(4px,-4px) rotate(3deg)}.fc-stack b{display:flex;align-items:center;justify-content:center;font-size:24px}
.fc-pile.unk .fc-stack{color:#e53935}.fc-pile.known .fc-stack{color:#43a047}.fc-pile.fresh .fc-stack{color:#78909c}
.fc-pt{display:block;font-weight:700;font-size:17px;margin-bottom:4px}.fc-bar{max-width:520px;margin:12px auto 4px}
.fc-mini{display:flex;gap:8px;margin-top:6px}.fp{font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px}.fp.unk{background:#fdecea;color:#c62828}.fp.known{background:#e8f5e9;color:#2e7d32}.fp.fresh{background:#eceff1;color:#546e7a}
.fc-ans .fc-no{border-color:#e57373;color:#c62828}.fc-ans .btn{min-width:150px}
.ms-top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.ms-top h2{margin:0 0 4px}
.ms-list{display:flex;flex-direction:column;gap:6px;margin:0 0 18px}.ms-q{display:grid;grid-template-columns:200px minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}@media(max-width:800px){.ms-q{grid-template-columns:1fr}}
.ms-s{display:flex;flex-wrap:wrap;gap:4px}.ms-ch{font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;background:var(--pri2);color:var(--pri)}.ms-ch.new{background:#fff3e0;color:#e65100}.ms-hot{font-size:11px;font-weight:800;color:#c62828}
.ms-themes{display:flex;flex-direction:column;gap:8px}.ms-th{display:flex;gap:14px;align-items:flex-start;margin:0}.ms-rank{font-size:26px;font-weight:800;color:var(--pri);min-width:34px;text-align:center}.ms-body{flex:1}.ms-h{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:center}.ms-h .ms-ch{margin-left:3px}
.ms-bar{height:8px;border-radius:4px;background:var(--line);margin:6px 0}.ms-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#ff7043,#e53935)}.ms-key{margin:4px 0 8px}
.ex-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.ex-th{position:relative;display:block;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:4/3;border:1px solid var(--line)}.ex-th img{width:100%;height:100%;object-fit:contain}.ex-th:hover{outline:2px solid var(--pri)}
.ex-n{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.7);color:#fff;font-weight:800;font-size:12px;padding:2px 7px;border-radius:8px}.ex-m{position:absolute;right:6px;top:6px;font-weight:800;padding:2px 7px;border-radius:8px;color:#fff}.ex-m.ok{background:#2e7d32}.ex-m.no{background:#c62828}
.ex-img{background:#000;border-radius:10px;margin:10px 0;text-align:center}.ex-img img{max-width:100%;max-height:70vh}.ex-dx{font-size:18px;font-weight:800;color:var(--pri);margin:6px 0 8px}.ex-sec{margin:8px 0;padding-top:6px;border-top:1px dashed var(--line)}.ex-sec ul{margin:4px 0 0 18px;padding:0}
.ex-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.ex-chips .chip{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:4px 10px;font-size:13px}.ex-chips .chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}.ex-chips .chip.on .muted{color:#e0f2f1}
.ex-steps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}.ex-steps span{background:var(--pri2);color:var(--pri);font-weight:700;font-size:13px;padding:4px 10px;border-radius:14px}
.ex-tbl th{width:170px;text-align:left;vertical-align:top}.ex-tbl td{vertical-align:top}.ex-g{white-space:nowrap;width:90px}.btn.bad{background:#c62828;color:#fff;border-color:#c62828}
.fx-steps{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}.fx-steps span{padding:5px 12px;border-radius:14px;background:var(--line);font-weight:700;font-size:13px}.fx-steps span.on{background:var(--pri);color:#fff}
.fx-row{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:start;padding:10px 0;border-top:1px dashed var(--line)}.fx-row img{width:200px;max-height:150px;object-fit:contain;background:#000;border-radius:8px}.fx-qa{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:6px;font-size:14px}
@media(max-width:700px){.fx-row{grid-template-columns:1fr}.fx-row img{width:100%}}
.fx-miss{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start;padding:12px 0;border-top:1px dashed var(--line)}.fx-miss img{width:100%;max-height:360px;object-fit:contain;background:#000;border-radius:8px}@media(max-width:800px){.fx-miss{grid-template-columns:1fr}}

            PLAN_DRAFT = null;
            S.meta = S.meta || {};
            if (!S.meta.examDate) {
                S.meta.t = 'meta';
                S.meta.id = 'meta';
                S.meta.examDate = S.plans[APP.subj].exam;
                save(S.meta);
            }
            render();
            toast('Your plan is ready.');
            break;
        }
        case 'planRe':
            planSave(genPlan(S.plans[APP.subj]));
            track('plan:replan');
            render();
            toast('Plan rebuilt from today.');
            break;
        case 'planIcs':
            planIcs();
            track('plan:ics');
            break;
        case 'ltab':
            LTAB = id;
            track('tab:' + id);
            render();
            break;
        case 'subject':
            switchSubject(id);
            break;
        case 'cpart':
            LPART = +id;
            render();
            break;
        case 'startLec':
            startLec(id);
            break;
        case 'openPart': {
            var k = el.getAttribute('data-k');
            LTAB = 'course';
            LPART = +k.split('-c')[1];
            go('lesson', id);
            break;
        }
        case 'admSel':
            ADM.sel = ADM.sel === id ? null : id;
            render();
            break;
        case 'admReload':
            ADM.data = null;
            ADM.err = null;
            render();
            break;
        case 'scrollTo':
            {
                var t = document.getElementById(id);
                if (t)
                    t.scrollIntoView();
            }
            break;
        case 'openRef':
            LTAB = 'sheets';
            go('lesson', el.getAttribute('data-t'));
            setTimeout(function () { var s = document.getElementById('sh-' + id); if (s) {
                s.open = true;
                s.scrollIntoView();
            } }, 50);
            break;
        case 'startLecture':
            startLecture(id);
            break;
        case 'xdeck':
            startXDeck(el.getAttribute('data-k') || '', id);
            break;
        case 'flashLecture':
            startFlash(id, el.getAttribute('data-m') || '');
            break;
        case 'flashPick':
            FC = null;
            go('flash');
            break;
        case 'flip':
            FC.flip = !FC.flip;
            render();
            break;
        case 'fcPile': {
            var P = fcPiles(FC.deck);
            var list = id === 'todo' ? P.unk.concat(P.fresh) : id === 'all' ? FC.deck.slice() : P[id] || [];
            if (!list.length) {
                toast('This pile is empty.');
                break;
            }
            FC.cards = shuffle(list.slice());
            FC.pile = id;
            FC.i = 0;
            FC.flip = false;
            FC.stage = 'run';
            render();
            window.scrollTo(0, 0);
            break;
        }
        case 'fcPiles':
            FC.stage = 'pick';
            render();
            break;
        case 'fcResetPile': {
            if (!confirmSafe())
                break;
            S.fc.known = S.fc.known || {};
            S.fc.unk = S.fc.unk || {};
            FC.deck.forEach(function (c) { delete S.fc.known[c.k]; delete S.fc.unk[c.k]; });
            S.fc.t = 'fc';
            S.fc.id = 'fc';
            save(S.fc);
            render();
            break;
        }
        case 'fcKnow':
        case 'fcAgain': {
            var c = FC.cards[FC.i];
            S.fc.known = S.fc.known || {};
            S.fc.unk = S.fc.unk || {};
            fcMark(c);
            if (act === 'fcKnow') {
                S.fc.known[c.k] = 1;
                delete S.fc.unk[c.k];
            }
            else {
                delete S.fc.known[c.k];
                S.fc.unk[c.k] = 1;
            }
            S.fc.t = 'fc';
            S.fc.id = 'fc';
            FC.i++;
            FC.flip = false;
            save(S.fc);
            render();
            break;
        }
        case 'tick': {
            var q = Q(RUN.qs[RUN.i]);
            var l_1 = el.getAttribute('data-l');
            var a = (RUN.ans[q.id] || []).slice();
            if (a.indexOf(l_1) >= 0)
                a = a.filter(function (x) { return x !== l_1; });
            else if (q.single)
                a = [l_1];
            else
                a.push(l_1);
            RUN.ans[q.id] = a.sort();
            render();
            break;
        }
        case 'check': {
            var q = Q(RUN.qs[RUN.i]);
            if (!(RUN.ans[q.id] || []).length) {
                toast('Tick at least one proposition.');
                break;
            }
            RUN.checked[q.id] = true;
            render();
            break;
        }
        case 'next':
            RUN.i = Math.min(RUN.qs.length - 1, RUN.i + 1);
            render();
            break;
        case 'prev':
            RUN.i = Math.max(0, RUN.i - 1);
            render();
            break;
        case 'jump':
            RUN.i = +el.getAttribute('data-i');
            render();
            break;
        case 'finish':
            finishRun();
            break;
        case 'qhint': {
            var q = Q(RUN.qs[RUN.i]);
            tutorAsk('Give me a hint for this question without revealing the answer.');
            break;
        }
        case 'openReview':
            go('review', id);
            break;
        case 'redoWrong': {
            var a = S.attempts.filter(function (x) { return x.id === id; })[0];
            var ids = a.items.filter(function (it) { return it.a.length && qScore(Q(it.q), it.a) < 1; }).map(function (it) { return it.q; });
            startSet({ kind: 'redo', label: 'Redo my mistakes', qs: shuffle(ids), mode: 'practice' });
            break;
        }
        case 'redoTopic': {
            var last_1 = lastAnswers();
            var ids = APP.core.questions.filter(function (q) { return q.topic === id && last_1[q.id] && qScore(q, last_1[q.id].a) < 1; }).map(function (q) { return q.id; });
            startSet({ kind: 'redo', label: 'Redo mistakes: ' + APP.lById[id].title, qs: shuffle(ids), mode: 'practice', topics: [id] });
            break;
        }
        case 'mockAll':
            document.querySelectorAll('.mockchk').forEach(function (c) { return c.checked = true; });
            break;
        case 'mockWeak': {
            var st_1 = lectureStats();
            var ord_1 = Object.keys(st_1).filter(function (k) { return st_1[k].total; }).sort(function (a, b) { return (st_1[a].pct == null ? 50 : st_1[a].pct) - (st_1[b].pct == null ? 50 : st_1[b].pct); }).slice(0, 4);
            document.querySelectorAll('.mockchk').forEach(function (c) { return c.checked = ord_1.indexOf(c.value) >= 0; });
            break;
        }
        case 'mockStart': {
            var t_1 = [];
            document.querySelectorAll('.mockchk').forEach(function (c) { if (c.checked)
                t_1.push(c.value); });
            startMock(t_1);
            break;
        }
        case 'finalStart':
            startFinal();
            break;
        case 'paper': {
            var P = papers()[id];
            startSet({ kind: 'paper', label: id, qs: P.slice(), mode: el.getAttribute('data-m') });
            break;
        }
        case 'openCase':
            startCase(id);
            if (CASE) {
                CASE.mode = 'ix';
                CASE.ix = { stage: 0, clues: {}, dd: {}, tests: {}, dx: null, tx: null, done: {} };
            }
            render();
            break;
        case 'caseJump':
            saveCaseText();
            CASE.i = +el.getAttribute('data-i');
            render();
            break;
        case 'casePrev':
            saveCaseText();
            CASE.i = Math.max(0, CASE.i - 1);
            render();
            break;
        case 'caseNext':
            saveCaseText();
            CASE.i++;
            render();
            break;
        case 'caseHint':
            saveCaseText();
            CASE.hints[CASE.i] = Math.min(2, (CASE.hints[CASE.i] || 0) + 1);
            render();
            break;
        case 'caseJudge':
            judge();
            break;
        case 'caseShow':
            saveCaseText();
            CASE.shown[CASE.i] = true;
            render();
            break;
        case 'selfScore': {
            var s = +el.getAttribute('data-s');
            var hc = CASE.hints[CASE.i] || 0;
            CASE.results[CASE.i] = { score: Math.max(0, s - hc * 0.5), raw: s, hintCost: 0, good: [], missing: [], wrong: [], feedback: 'Self-assessment saved – comparing with the teacher\'s answer is a great way to learn.', followup: '' };
            render();
            break;
        }
        case 'dictate':
            dictate(el);
            break;
        case 'tutorOpen':
            TUTOR.open = !TUTOR.open;
            if (TUTOR.open)
                renderTutor();
            else
                $('#tutor').className = '';
            break;
        case 'tutorClose':
            TUTOR.open = false;
            $('#tutor').className = '';
            break;
        case 'tutorAsk':
            tutorAsk(el.getAttribute('data-q'));
            break;
    }
});
function saveCaseText() { var ta = $('#caseAns'); if (ta && CASE)
    CASE.answers[CASE.i] = ta.value; }
document.addEventListener('change', function (ev) {
    var dc = ev.target && ev.target.getAttribute('data-change'), did = ev.target && ev.target.getAttribute('data-id');
    if (dc === 'pd' && PLAN_DRAFT) {
        PLAN_DRAFT[did] = ev.target.value;
        if (did === 'start' || did === 'exam') {
            if (!PLAN_DRAFT.touched)
                spreadLectures(PLAN_DRAFT);
        }
        render();
        return;
    }
    if (dc === 'ph' && PLAN_DRAFT) {
        PLAN_DRAFT.hours[+did] = Math.max(0, +ev.target.value || 0);
        render();
        return;
    }
    if (dc === 'pk' && PLAN_DRAFT) {
        PLAN_DRAFT.known = PLAN_DRAFT.known || {};
        if (ev.target.checked)
            PLAN_DRAFT.known[did] = 1;
        else
            delete PLAN_DRAFT.known[did];
        return;
    }
    if (dc === 'pl' && PLAN_DRAFT) {
        PLAN_DRAFT.lec[did] = ev.target.value;
        PLAN_DRAFT.touched = 1;
        return;
    }
    if (dc === 'ptask') {
        var p = S.plans[APP.subj];
        var t = p && p.tasks.filter(function (x) { return x.id === did; })[0];
        if (t) {
            if (ev.target.checked)
                t.done = Date.now();
            else
                delete t.done;
            planSave(p);
            render();
        }
        return;
    }
    if (ev.target && ev.target.getAttribute('data-change') === 'examDate') {
        S.meta = S.meta || {};
        S.meta.t = 'meta';
        S.meta.id = 'meta';
        S.meta.examDate = ev.target.value;
        save(S.meta);
        render();
    }
});
document.addEventListener('submit', function (ev) { if (ev.target.id === 'emailF') {
    ev.preventDefault();
    emailSubmit();
    return;
} if (ev.target.id === 'tutF') {
    ev.preventDefault();
    var v = $('#tutIn').value.trim();
    if (v)
        tutorAsk(v);
} });
var dictOn = false;
function dictate(btn) {
    if (!DICT)
        return;
    if (dictOn) {
        DICT.stop().catch(function () { });
        return;
    }
    var p = DICT.start();
    if (p && p.catch)
        p.catch(function (e) { dictOn = false; if (e && e.code === 'not_granted') {
            DICT = null;
            render();
        }
        else
            toast('Dictation is not available right now.'); });
    if (!dictate._wired) {
        dictate._wired = true;
        DICT.onFinal(function (o) { var ta = $('#caseAns'); if (ta) {
            ta.value = (ta.value ? ta.value + ' ' : '') + o.text;
            if (CASE)
                CASE.answers[CASE.i] = ta.value;
        } });
        DICT.onState(function (o) { dictOn = o.state === 'listening'; var b = $('#micBtn'); if (b)
            b.textContent = dictOn ? '■ Stop' : '🎤 Dictate'; });
    }
}
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && USE_T)
    flushUse(); });
window.addEventListener('hashchange', function () { var n = location.hash.slice(1); if (n !== VIEW.name && NAV.some(function (x) { return x[0] === n; }))
    go(n); });
if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', boot);
else
    boot();
</script>
</body>
</html>
