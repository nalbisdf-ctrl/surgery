<style>

.prose p{margin:6px 0}.sumtext h2{color:var(--pri);margin-top:18px}.sumtext h3{margin-top:14px}.sumtext ul{padding-left:20px;margin:4px 0}.sumtext h4{margin:10px 0 4px;color:var(--pri)}

<script>"use strict";
if (window.NodeList && !NodeList.prototype.forEach)
    NodeList.prototype.forEach = Array.prototype.forEach;
/* SVG drawings & mind maps — all generated, colours from CSS variables */
var SVGNS = 'http://www.w3.org/2000/svg';
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function wrapText(text, maxChars) {
    var words = String(text).split(/\s+/);
    var lines = [];
    var cur = '';
    words.forEach(function (w) { if ((cur + ' ' + w).trim().length > maxChars && cur) {
        lines.push(cur);
        cur = w;
    }
    else
        cur = (cur + ' ' + w).trim(); });
    if (cur)
        lines.push(cur);
    return lines;
}
function tspans(lines, x, y, lh) { return lines.map(function (l, i) { return "<tspan x=\"".concat(x, "\" y=\"").concat(y + i * lh, "\">").concat(esc(l), "</tspan>"); }).join(''); }
/* ---------- Mind map: root → pathologies → 3 leaves ---------- */
function mindMap(lecture, paths) {
    var rows = paths.map(function (p) { return ({ name: p.n, leaves: (lecture.mm && lecture.mm[p.n]) || [] }); });
    var W = 760, LH = 15, PAD = 8;
    var y = 16;
    var blocks = [];
    rows.forEach(function (r) {
        var nameLines = wrapText(r.name, 24);
        var leafBoxes = r.leaves.map(function (l) { return wrapText(l, 30); });
        var leafH = leafBoxes.map(function (lb) { return lb.length * LH + PAD * 2; });
        var leavesTotal = leafH.reduce(function (a, b) { return a + b + 6; }, 0) - 6;
        var nameH = nameLines.length * LH + PAD * 2;
        var h = Math.max(nameH, leavesTotal, 30);
        blocks.push({ r: r, nameLines: nameLines, leafBoxes: leafBoxes, leafH: leafH, y: y, h: h, nameH: nameH });
        y += h + 18;
    });
    var H = Math.max(y, 120);
    var rootLines = wrapText(lecture.title, 16);
    var rootH = rootLines.length * 17 + 20, rootY = H / 2 - rootH / 2;
    var s = "<svg viewBox=\"0 0 ".concat(W, " ").concat(H, "\" class=\"mm\" role=\"img\" aria-label=\"Mind map ").concat(esc(lecture.title), "\" xmlns=\"").concat(SVGNS, "\">");
    s += "<rect x=\"8\" y=\"".concat(rootY, "\" width=\"150\" height=\"").concat(rootH, "\" rx=\"12\" class=\"mm-root\"/>");
    s += "<text class=\"mm-root-t\" text-anchor=\"middle\">".concat(tspans(rootLines, 83, rootY + 24, 17), "</text>");
    blocks.forEach(function (b, i) {
        var ny = b.y + (b.h - b.nameH) / 2, cy = ny + b.nameH / 2;
        s += "<path d=\"M158 ".concat(H / 2, " C 190 ").concat(H / 2, ", 190 ").concat(cy, ", 220 ").concat(cy, "\" class=\"mm-edge\"/>");
        s += "<rect x=\"220\" y=\"".concat(ny, "\" width=\"210\" height=\"").concat(b.nameH, "\" rx=\"9\" class=\"mm-node c").concat(i % 6, "\"/>");
        s += "<text class=\"mm-node-t\">".concat(tspans(b.nameLines, 232, ny + PAD + 11, LH), "</text>");
        var ly = b.y + (b.h - (b.leafH.reduce(function (a, c) { return a + c + 6; }, 0) - 6)) / 2;
        b.leafBoxes.forEach(function (lb, j) {
            var lh = b.leafH[j], lcy = ly + lh / 2;
            s += "<path d=\"M430 ".concat(cy, " C 455 ").concat(cy, ", 455 ").concat(lcy, ", 480 ").concat(lcy, "\" class=\"mm-edge\"/>");
            s += "<rect x=\"480\" y=\"".concat(ly, "\" width=\"270\" height=\"").concat(lh, "\" rx=\"7\" class=\"mm-leaf\"/>");
            s += "<text class=\"mm-leaf-t\">".concat(tspans(lb, 491, ly + PAD + 11, LH), "</text>");
            ly += lh + 6;
        });
    });
    return s + '</svg>';
}
/* ---------- generic helpers ---------- */
function ladder(title, items) {
    var W = 640, rowH = 46;
    var H = 40 + items.length * (rowH + 8);
    var s = "<svg viewBox=\"0 0 ".concat(W, " ").concat(H, "\" class=\"dr\" xmlns=\"").concat(SVGNS, "\"><text x=\"12\" y=\"24\" class=\"dr-title\">").concat(esc(title), "</text>");
    items.forEach(function (it, i) {
        var y = 38 + i * (rowH + 8);
        var lines = wrapText(it[1], 62);
        s += "<rect x=\"12\" y=\"".concat(y, "\" width=\"96\" height=\"").concat(rowH, "\" rx=\"8\" class=\"lv lv").concat(Math.min(i, 5), "\"/><text x=\"60\" y=\"").concat(y + 28, "\" text-anchor=\"middle\" class=\"lv-t\">").concat(esc(it[0]), "</text>");
        s += "<rect x=\"116\" y=\"".concat(y, "\" width=\"").concat(W - 128, "\" height=\"").concat(rowH, "\" rx=\"8\" class=\"box\"/><text class=\"box-t\">").concat(tspans(lines, 128, y + (lines.length > 1 ? 19 : 28), 16), "</text>");
    });
    return s + '</svg>';
}
function flow(title, steps) {
    var W = 640, bw = 330, x = (W - bw) / 2;
    var y = 40;
    var s = '';
    var parts = [];
    steps.forEach(function (st, i) {
        var lines = wrapText(st[0], 40);
        var h = lines.length * 16 + 18;
        parts.push({ st: st, lines: lines, y: y, h: h });
        y += h + (st[2] ? 30 : 26);
    });
    var H = y + 10;
    s += "<svg viewBox=\"0 0 ".concat(W, " ").concat(H, "\" class=\"dr\" xmlns=\"").concat(SVGNS, "\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" class=\"arrowhead\"/></marker></defs>");
    s += "<text x=\"12\" y=\"24\" class=\"dr-title\">".concat(esc(title), "</text>");
    parts.forEach(function (p, i) {
        var cls = p.st[1] === 'q' ? 'fq' : p.st[1] === 'e' ? 'fe' : 'fa';
        s += "<rect x=\"".concat(x, "\" y=\"").concat(p.y, "\" width=\"").concat(bw, "\" height=\"").concat(p.h, "\" rx=\"").concat(p.st[1] === 'q' ? 4 : 10, "\" class=\"").concat(cls, "\"/>");
        s += "<text text-anchor=\"middle\" class=\"f-t\">".concat(tspans(p.lines, W / 2, p.y + 22, 16), "</text>");
        if (p.st[2]) { // side branch
            var bl = wrapText(p.st[2], 18);
            var bh = bl.length * 15 + 14;
            var by = p.y + p.h / 2 - bh / 2;

        return "The student is reading the lesson \"".concat(l.title, "\". Key facts: ").concat(l.key.join('; '), ". Pathologies: ").concat(lecturePaths(l.id).map(function (p) { return p.n + ': ' + p.def; }).join(' || ').slice(0, 3000));
    }
    if (VIEW.name === 'case' && CASE) {
        var st = CASE.c.steps[CASE.i];
        return "The student is practising the clinical case \"".concat(CASE.c.title, "\": ").concat(CASE.c.presentation, ". Current step: ").concat(st ? st.q : 'summary', ". Do not give the full teacher answer before they submit; give guiding hints.");
    }
    return 'The student is on the ' + VIEW.name + ' page of a general surgery study platform (UMF Cluj, 4th year).';
}
function renderTutor() {
    var p = $('#tutor');
    p.className = 'open';
    p.innerHTML = "<div class=\"tut-h\"><b>Ask the tutor</b><button class=\"btn sm\" data-act=\"tutorClose\">\u2715</button></div>\n  <div class=\"tut-q\"><button class=\"btn sm\" data-act=\"tutorAsk\" data-q=\"Give me the 5 key points for what I am looking at.\">5 key points</button><button class=\"btn sm\" data-act=\"tutorAsk\" data-q=\"Quiz me with one short question about this topic, then wait for my answer.\">Quiz me</button><button class=\"btn sm\" data-act=\"tutorAsk\" data-q=\"Give me a mnemonic to remember this.\">Mnemonic</button></div>\n  <div class=\"tut-m\" id=\"tutM\">".concat(TUTOR.msgs.map(function (m) { return "<div class=\"msg ".concat(m.role, "\">").concat(h(m.content), "</div>"); }).join('') || '<p class="muted small">Ask anything about the lecture or question you are on.</p>').concat(TUTOR.busy ? '<div class="msg assistant muted">…</div>' : '', "</div>\n  <form id=\"tutF\" class=\"tut-f\"><input id=\"tutIn\" class=\"inp\" placeholder=\"Your question\u2026\" autocomplete=\"off\"><button class=\"btn primary\">Send</button></form>");
    var m = $('#tutM');
    m.scrollTop = m.scrollHeight;
}
function tutorAsk(text) {
    if (!AI || TUTOR.busy || !text)
        return;
    TUTOR.open = true;
    TUTOR.msgs.push({ role: 'user', content: text });
    TUTOR.busy = true;
    renderTutor();
    var sys = 'You are a friendly, encouraging general-surgery tutor for a 4th-year medical student at UMF Iuliu Hatieganu Cluj (exam in English). Be concise (max ~150 words), use bullet points, base yourself on standard surgical teaching. Context: ' + tutorContext();
    var msgs = [{ role: 'user', content: sys + '\n\nStudent: ' + TUTOR.msgs[0].content }].concat(TUTOR.msgs.slice(1).map(function (m) { return ({ role: m.role, content: m.content }); }));
    var idx = -1;
    AI(msgs, { cache: false, onText: function (o) { if (idx < 0) {
            TUTOR.msgs.push({ role: 'assistant', content: '' });
            idx = TUTOR.msgs.length - 1;
            TUTOR.busy = false;
        } TUTOR.msgs[idx].content = o.text; renderTutor(); } })
        .then(function (r) { if (idx < 0)
        TUTOR.msgs.push({ role: 'assistant', content: r.text });
    else
        TUTOR.msgs[idx].content = r.text; })
        .catch(function (e) { TUTOR.msgs.push({ role: 'assistant', content: e && e.code === 'rate_limited' ? 'I need a short break – try again in a minute.' : 'Sorry, I could not answer just now.' }); })
        .then(function () { TUTOR.busy = false; renderTutor(); });
}
/* ---------------- events ---------------- */
function closest(el, attr) { while (el && el !== document) {
    if (el.getAttribute && el.getAttribute(attr) != null)
        return el;
    el = el.parentNode;
} return null; }
document.addEventListener('click', function (ev) {
    var nav = closest(ev.target, 'data-nav');
    if (nav) {
        ev.preventDefault();
        $('#side').className = '';
        go(nav.getAttribute('data-nav'));
        return;
    }
    var el = closest(ev.target, 'data-act');
    if (!el)
        return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    if (el.tagName === 'A' || el.tagName === 'BUTTON')
        ev.preventDefault();
    switch (act) {
        case 'google':
            googleLogin();
            break;
        case 'guest':
            startGuest();
            break;
        case 'logout':
            logout();
            break;
        case 'theme':
            toggleTheme();
            break;
        case 'menu':
            $('#side').className = $('#side').className === 'open' ? '' : 'open';
            break;
        case 'help':
            go('help');
            break;
        case 'nav':
            go(id);
            break;
        case 'openLesson':
            go('lesson', id);
            break;
        case 'openRef':
            go('lesson', el.getAttribute('data-t'));
            setTimeout(function () { var s = document.getElementById('sh-' + id); if (s) {
                s.open = true;
                s.scrollIntoView();
            } }, 50);
            break;
        case 'startLecture':
            startLecture(id);
            break;
        case 'flashLecture':
            startFlash(id);
            break;
        case 'flashPick':
            FC = null;
            go('flash');
            break;
        case 'flip':
            FC.flip = !FC.flip;
            render();
            break;
        case 'fcKnow':
        case 'fcAgain': {
            var c = FC.cards[FC.i];
            S.fc.known = S.fc.known || {};
            if (act === 'fcKnow')
                S.fc.known[c.k] = 1;
            else
                delete S.fc.known[c.k];
            S.fc.t = 'fc';
            S.fc.id = 'fc';
            FC.i++;
            FC.flip = false;
            save(S.fc);
            render();
            break;
        }
        case 'tick': {
            var q = Q(RUN.qs[RUN.i]);
            var l_1 = el.getAttribute('data-l');
            var a = (RUN.ans[q.id] || []).slice();
            if (a.indexOf(l_1) >= 0)
                a = a.filter(function (x) { return x !== l_1; });
            else if (q.single)
                a = [l_1];
            else
                a.push(l_1);
            RUN.ans[q.id] = a.sort();
            render();
            break;
        }
        case 'check': {
            var q = Q(RUN.qs[RUN.i]);
            if (!(RUN.ans[q.id] || []).length) {
                toast('Tick at least one proposition.');
                break;
            }
            RUN.checked[q.id] = true;
            render();
            break;
        }
        case 'next':
            RUN.i = Math.min(RUN.qs.length - 1, RUN.i + 1);
            render();
            break;
        case 'prev':
            RUN.i = Math.max(0, RUN.i - 1);
            render();
            break;
        case 'jump':
            RUN.i = +el.getAttribute('data-i');
            render();
            break;
        case 'finish':
            finishRun();
            break;
        case 'qhint': {
            var q = Q(RUN.qs[RUN.i]);
            tutorAsk('Give me a hint for this question without revealing the answer.');
            break;
        }
        case 'openReview':
            go('review', id);
            break;
        case 'redoWrong': {
            var a = S.attempts.filter(function (x) { return x.id === id; })[0];
            var ids = a.items.filter(function (it) { return it.a.length && qScore(Q(it.q), it.a) < 1; }).map(function (it) { return it.q; });
            startSet({ kind: 'redo', label: 'Redo my mistakes', qs: shuffle(ids), mode: 'practice' });
            break;
        }
        case 'redoTopic': {
            var last_1 = lastAnswers();
            var ids = APP.core.questions.filter(function (q) { return q.topic === id && last_1[q.id] && qScore(q, last_1[q.id].a) < 1; }).map(function (q) { return q.id; });
            startSet({ kind: 'redo', label: 'Redo mistakes: ' + APP.lById[id].title, qs: shuffle(ids), mode: 'practice', topics: [id] });
            break;
        }
        case 'mockAll':
            document.querySelectorAll('.mockchk').forEach(function (c) { return c.checked = true; });
            break;
        case 'mockWeak': {
            var st_1 = lectureStats();
            var ord_1 = Object.keys(st_1).filter(function (k) { return st_1[k].total; }).sort(function (a, b) { return (st_1[a].pct == null ? 50 : st_1[a].pct) - (st_1[b].pct == null ? 50 : st_1[b].pct); }).slice(0, 4);
            document.querySelectorAll('.mockchk').forEach(function (c) { return c.checked = ord_1.indexOf(c.value) >= 0; });
            break;
        }
        case 'mockStart': {
            var t_1 = [];
            document.querySelectorAll('.mockchk').forEach(function (c) { if (c.checked)
                t_1.push(c.value); });
            startMock(t_1);
            break;
        }
        case 'finalStart':
            startFinal();
            break;
        case 'paper': {
            var P = papers()[id];
            startSet({ kind: 'paper', label: id, qs: P.slice(), mode: el.getAttribute('data-m') });
            break;
        }
        case 'openCase':
            startCase(id);
            break;
        case 'caseJump':
            saveCaseText();
            CASE.i = +el.getAttribute('data-i');
            render();
            break;
        case 'casePrev':
            saveCaseText();
            CASE.i = Math.max(0, CASE.i - 1);
            render();
            break;
        case 'caseNext':
            saveCaseText();
            CASE.i++;
            render();
            break;
        case 'caseHint':
            saveCaseText();
            CASE.hints[CASE.i] = Math.min(2, (CASE.hints[CASE.i] || 0) + 1);
            render();
            break;
        case 'caseJudge':
            judge();
            break;
        case 'caseShow':
            saveCaseText();
            CASE.shown[CASE.i] = true;
            render();
            break;
        case 'selfScore': {
            var s = +el.getAttribute('data-s');
            var hc = CASE.hints[CASE.i] || 0;
            CASE.results[CASE.i] = { score: Math.max(0, s - hc * 0.5), raw: s, hintCost: 0, good: [], missing: [], wrong: [], feedback: 'Self-assessment saved – comparing with the teacher\'s answer is a great way to learn.', followup: '' };
            render();
            break;
        }
        case 'dictate':
            dictate(el);
            break;
        case 'tutorOpen':
            TUTOR.open = !TUTOR.open;
            if (TUTOR.open)
                renderTutor();
            else
                $('#tutor').className = '';
            break;
        case 'tutorClose':
            TUTOR.open = false;
            $('#tutor').className = '';
            break;
        case 'tutorAsk':
            tutorAsk(el.getAttribute('data-q'));
            break;
    }
});
function saveCaseText() { var ta = $('#caseAns'); if (ta && CASE)
    CASE.answers[CASE.i] = ta.value; }
document.addEventListener('change', function (ev) {
    if (ev.target && ev.target.getAttribute('data-change') === 'examDate') {
        S.meta = S.meta || {};
        S.meta.t = 'meta';
        S.meta.id = 'meta';
        S.meta.examDate = ev.target.value;
        save(S.meta);
        render();
    }
});
document.addEventListener('submit', function (ev) { if (ev.target.id === 'tutF') {
    ev.preventDefault();
    var v = $('#tutIn').value.trim();
    if (v)
        tutorAsk(v);
} });
var dictOn = false;
function dictate(btn) {
    if (!DICT)
        return;
    if (dictOn) {
        DICT.stop().catch(function () { });
        return;
    }
    var p = DICT.start();
    if (p && p.catch)
        p.catch(function (e) { dictOn = false; if (e && e.code === 'not_granted') {
            DICT = null;
            render();
        }
        else
            toast('Dictation is not available right now.'); });
    if (!dictate._wired) {
        dictate._wired = true;
        DICT.onFinal(function (o) { var ta = $('#caseAns'); if (ta) {
            ta.value = (ta.value ? ta.value + ' ' : '') + o.text;
            if (CASE)
                CASE.answers[CASE.i] = ta.value;
        } });
        DICT.onState(function (o) { dictOn = o.state === 'listening'; var b = $('#micBtn'); if (b)
            b.textContent = dictOn ? '■ Stop' : '🎤 Dictate'; });
    }
}
window.addEventListener('hashchange', function () { var n = location.hash.slice(1); if (n !== VIEW.name && NAV.some(function (x) { return x[0] === n; }))
    go(n); });
if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', boot);
else
    boot();
</script>
